<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#cba6f7"/>
      <stop offset="100%" stop-color="#f38ba8"/>
    </linearGradient>
    <linearGradient id="deckGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#24273a"/>
      <stop offset="100%" stop-color="#181926"/>
    </linearGradient>
    <linearGradient id="rgbSpace" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f38ba8"/>
      <stop offset="25%" stop-color="#fab387"/>
      <stop offset="50%" stop-color="#a6e3a1"/>
      <stop offset="75%" stop-color="#89dceb"/>
      <stop offset="100%" stop-color="#cba6f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Laptop Keyboard Base / Well -->
  <rect x="28" y="44" width="200" height="152" rx="16" fill="url(#deckGrad)" stroke="#313244" stroke-width="2"/>

  <!-- Row 1 (Function / Number keys) -->
  <rect x="38" y="56" width="24" height="20" rx="5" fill="#f38ba8" filter="url(#glow)"/>
  <rect x="68" y="56" width="24" height="20" rx="5" fill="#fab387"/>
  <rect x="98" y="56" width="24" height="20" rx="5" fill="#f9e2af"/>
  <rect x="128" y="56" width="24" height="20" rx="5" fill="#a6e3a1"/>
  <rect x="158" y="56" width="28" height="20" rx="5" fill="#89dceb"/>
  <rect x="192" y="56" width="26" height="20" rx="5" fill="#89b4fa"/>

  <!-- Row 2 (QWERTY) -->
  <rect x="38" y="84" width="30" height="20" rx="5" fill="#f38ba8"/>
  <rect x="74" y="84" width="24" height="20" rx="5" fill="#fab387"/>
  <rect x="104" y="84" width="24" height="20" rx="5" fill="#a6e3a1" filter="url(#glow)"/>
  <rect x="134" y="84" width="24" height="20" rx="5" fill="#94e2d5"/>
  <rect x="164" y="84" width="24" height="20" rx="5" fill="#89b4fa"/>
  <rect x="194" y="84" width="24" height="20" rx="5" fill="#cba6f7"/>

  <!-- Row 3 (ASDF) -->
  <rect x="38" y="112" width="34" height="20" rx="5" fill="#f38ba8"/>
  <rect x="78" y="112" width="24" height="20" rx="5" fill="#f9e2af"/>
  <rect x="108" y="112" width="24" height="20" rx="5" fill="#a6e3a1"/>
  <rect x="138" y="112" width="24" height="20" rx="5" fill="#89dceb" filter="url(#glow)"/>
  <rect x="168" y="112" width="24" height="20" rx="5" fill="#b4befe"/>
  <rect x="198" y="112" width="20" height="20" rx="5" fill="#cba6f7"/>

  <!-- Row 4 (Spacebar and Bottom Row) -->
  <rect x="38" y="140" width="28" height="22" rx="5" fill="#eba0ac"/>
  <rect x="72" y="140" width="24" height="22" rx="5" fill="#f9e2af"/>
  <rect x="102" y="140" width="76" height="22" rx="6" fill="url(#rgbSpace)" filter="url(#glow)"/>
  <rect x="184" y="140" width="34" height="22" rx="5" fill="#cba6f7"/>

  <!-- Trackpad Subtle Outline -->
  <rect x="96" y="172" width="64" height="14" rx="4" fill="none" stroke="#45475a" stroke-width="1.5"/>

  <!-- Acer ALG Badge Indicator -->
  <circle cx="218" cy="38" r="8" fill="#38bdf8" filter="url(#glow)"/>
</svg>